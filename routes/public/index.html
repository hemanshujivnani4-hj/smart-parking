<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #parkingList {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );

            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🚗 Smart Parking Finder</h1>
    <p>Find and book parking spaces easily</p>
</header>

<div class="container">

    <h2>Available Parking</h2>

    <button onclick="loadParking()">
        Find Parking
    </button>

    <div id="parkingList">
        <p>Click "Find Parking" to see parking locations.</p>
    </div>

</div>

<script>

async function loadParking() {
    async function cancelBooking(bookingId) {

    const confirmCancel = confirm(
        "Are you sure you want to cancel this booking?"
    );

    if (!confirmCancel) {
        return;
    }

    try {

        const response = await fetch(
            "/api/bookings/" + bookingId,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {

            alert(
                "❌ Cancellation failed:\n" +
                result.message
            );

            return;
        }

        alert(
            "✅ Booking cancelled successfully!"
        );

        // Reload bookings
        loadBookings();

        // Reload parking availability
        loadParking();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Something went wrong.\n\n" +
            error.message
        );
    }
}
    async function cancelBooking(bookingId) {

    const confirmCancel = confirm(
        "Are you sure you want to cancel this booking?"
    );

    if (!confirmCancel) {
        return;
    }

    try {

        const response = await fetch(
            "/api/bookings/" + bookingId,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {

            alert(
                "❌ Cancellation failed:\n" +
                result.message
            );

            return;
        }

        alert(
            "✅ Booking cancelled successfully!"
        );

        // Reload bookings
        loadBookings();

        // Reload parking availability
        loadParking();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Something went wrong.\n\n" +
            error.message
        );
    }
}

    const parkingList =
        document.getElementById("parkingList");

    parkingList.innerHTML =
        "<p>Loading...</p>";

    try {

        const response =
            await fetch("/api/parking");

        const parkingData =
            await response.json();

        parkingList.innerHTML = "";

        parkingData.forEach(parking => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>🚗 ${parking.name}</h3>

                <p>
                    📍 ${parking.location}
                </p>

                <p>
                    Total Slots:
                    ${parking.totalSlots}
                </p>

                <p class="available">
                    Available Slots:
                    ${parking.availableSlots}
                </p>

                <p class="price">
                    ₹${parking.pricePerHour} / hour
                </p>

                <button onclick="bookParking('${parking._id}')">
                    Book Parking
                </button>
            `;

            parkingList.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        parkingList.innerHTML =
            "<p>❌ Unable to load parking.</p>";
    }
}


async function bookParking(parkingId) {

    const name = prompt("Enter your name:");

    if (!name) {
        return;
    }

    const vehicleNumber = prompt("Enter vehicle number:");

    if (!vehicleNumber) {
        return;
    }

    const hoursInput = prompt("Enter number of hours:");

    const hours = Number(hoursInput);

    if (!hoursInput || isNaN(hours) || hours <= 0) {
        alert("❌ Please enter a valid number of hours.");
        return;
    }

    try {

        // Get parking information
        const parkingResponse = await fetch("/api/parking");

        const parkingData = await parkingResponse.json();

        const parking = parkingData.find(
            p => p._id === parkingId
        );

        if (!parking) {
            alert("❌ Parking location not found.");
            return;
        }

        // Check availability
        if (parking.availableSlots <= 0) {
            alert("❌ No parking slots available.");
            return;
        }

        // Calculate total amount
        const amount =
            hours * parking.pricePerHour;

        // Time of booking
        const startTime = new Date();

        const endTime = new Date(
            startTime.getTime() +
            hours * 60 * 60 * 1000
        );

        const confirmBooking = confirm(
    "Booking Details\n\n" +
    "Name: " + name +
    "\nVehicle: " + vehicleNumber +
    "\nParking: " + parking.name +
    "\nHours: " + hours +
    "\nPrice/hour: ₹" + parking.pricePerHour +
    "\nTotal Amount: ₹" + amount +
    "\n\nProceed to Payment?"
);

      if (!confirmBooking) {
           return;
}

        if (!confirmBooking) {
            return;
        }

        // Send booking to backend
        const response = await fetch(
            "/api/bookings",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    parkingId: parkingId,

                    customerName: name,

                    vehicleNumber: vehicleNumber,

                    startTime: startTime.toISOString(),

                    endTime: endTime.toISOString(),

                    amount: amount

                })
            }
        );

        const result = await response.json();

        // Handle error
        if (!response.ok) {

            alert(
                "❌ Booking failed:\n" +
                result.message
            );

            return;
        }

        // Booking successful
        alert(
            "✅ BOOKING SUCCESSFUL!\n\n" +

            "Name: " +
            result.customerName +

            "\nVehicle: " +
            result.vehicleNumber +

            "\nParking: " +
            parking.name +

            "\nHours: " +
            hours +

            "\nAmount: ₹" +
            amount +

            "\n\nBooking ID:\n" +
            result._id
        );

        // Reload parking data
        loadParking();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Something went wrong.\n\n" +
            error.message
        );
    }
}

</script>


</body>
</html>
